apiVersion: apps/v1
kind: Deployment
metadata:
  name: "epamdemotest"
  namespace: "agents-platform-eng"
  labels:
    app: "epamdemotest"
    team: "platform-eng"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "epamdemotest"
  template:
    metadata:
      labels:
        app: "epamdemotest"
        team: "platform-eng"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-epamdemotest"
      containers:
        - name: "epamdemotest"
          image: "acragenticdemopoc.azurecr.io/agents/epamdemotest:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-epamdemotest"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
